<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{APP_NAME}}</title>
    <script src="https://cdn.socket.io/4.6.1/socket.io.prod.min.js"></script>
    <!-- Fallback: Local socket.io if CDN fails -->
    <script>
      if (!window.io) {
        var script = document.createElement('script');
        script.src = '/socket.io/socket.io.js';
        document.head.appendChild(script);
      }
    </script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
          Oxygen, Ubuntu, Cantarell, sans-serif;
        background: #f5f5f5;
        color: #333;
      }

      .container {
        display: flex;
        height: 100vh;
      }

      .sidebar {
        width: 300px;
        min-width: 300px; /* Force sidebar to maintain its exact width */
        background: #2c3e50;
        color: white;
        overflow-y: auto;
        border-right: 1px solid #34495e;
      }

      .sidebar-section {
        padding: 15px;
        border-bottom: 1px solid #34495e;
      }

      .sidebar-section h3 {
        font-size: 12px;
        text-transform: uppercase;
        color: #95a5a6;
        margin-bottom: 10px;
      }

      .auth-section {
        padding: 15px;
      }

      .form-group {
        margin-bottom: 10px;
      }

      .form-group label {
        display: block;
        font-size: 11px;
        margin-bottom: 4px;
        color: #95a5a6;
      }

      .form-group input,
      .form-group button {
        width: 100%;
        padding: 8px;
        border: 1px solid #34495e;
        border-radius: 3px;
        font-size: 13px;
      }

      .form-group input {
        background: #34495e;
        color: white;
      }

      .form-group input::placeholder {
        color: #7f8c8d;
      }

      .form-group button {
        background: #3498db;
        color: white;
        border: none;
        cursor: pointer;
        font-weight: 500;
      }

      .form-group button:hover {
        background: #2980b9;
      }

      .form-group button:disabled {
        background: #7f8c8d;
        cursor: not-allowed;
      }

      .user-info {
        background: #34495e;
        padding: 10px;
        border-radius: 3px;
        margin-bottom: 10px;
        font-size: 12px;
      }

      .user-info .username {
        font-weight: bold;
        color: #3498db;
      }

      .user-role {
        display: inline-block;
        background: #e74c3c;
        color: white;
        padding: 2px 6px;
        border-radius: 2px;
        font-size: 10px;
        margin: 3px 3px 0 0;
      }

      .rooms-list {
        list-style: none;
      }

      .rooms-list li {
        padding: 10px;
        cursor: pointer;
        border-left: 3px solid transparent;
        transition: all 0.2s;
      }

      .rooms-list li:hover {
        background: #34495e;
      }

      .rooms-list li.active {
        background: #3498db;
        border-left-color: #e74c3c;
      }

      .online-users {
        list-style: none;
        font-size: 12px;
      }

      .online-users li {
        padding: 8px;
        color: #2ecc71;
      }

      .online-users li::before {
        content: '● ';
        margin-right: 5px;
      }

      .main-content {
        flex: 1;
        display: flex;
        flex-direction: column;
        background: white;
        min-width: 0; /* Add min-width: 0 to prevent flexbox from expanding beyond container */
        min-height: 0; /* Add min-height: 0 to prevent vertical expanding and force scroll on child */
      }

      .header {
        padding: 15px 20px;
        border-bottom: 1px solid #ecf0f1;
        background: #f8f9fa;
      }

      .header h2 {
        margin: 0;
        font-size: 18px;
      }

      .header-info {
        font-size: 12px;
        color: #7f8c8d;
        margin-top: 5px;
      }

      .messages {
        flex: 1;
        overflow-y: auto;
        padding: 20px;
      }

      .message {
        margin-bottom: 15px;
        padding: 10px;
        background: #f8f9fa;
        border-radius: 5px;
      }

      .message-header {
        font-weight: bold;
        color: #2c3e50;
        margin-bottom: 5px;
        font-size: 13px;
      }

      .message-meta {
        font-size: 11px;
        color: #95a5a6;
        margin-left: 8px;
      }

      .message-text {
        color: #333;
        word-wrap: break-word;
        word-break: break-word;
        overflow-wrap: break-word;
        white-space: pre-wrap;
      }

      .typing-indicator {
        font-size: 12px;
        color: #95a5a6;
        font-style: italic;
        padding: 5px 0;
      }

      .input-area {
        padding: 15px;
        border-top: 1px solid #ecf0f1;
        background: #f8f9fa;
      }

      .input-wrapper {
        display: flex;
        gap: 10px;
      }

      .input-wrapper input {
        flex: 1;
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 5px;
        font-size: 14px;
      }

      .input-wrapper button {
        padding: 10px 15px;
        background: #3498db;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-weight: 500;
      }

      .input-wrapper button:hover {
        background: #2980b9;
      }

      .input-wrapper button:disabled {
        background: #bdc3c7;
        cursor: not-allowed;
      }

      .placeholder {
        text-align: center;
        color: #95a5a6;
        padding: 40px 20px;
      }

      .status {
        padding: 10px 20px;
        text-align: center;
        background: #ecf0f1;
        color: #7f8c8d;
        font-size: 12px;
      }

      .status.error {
        background: #e74c3c;
        color: white;
      }

      .status.success {
        background: #2ecc71;
        color: white;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <!-- SIDEBAR -->
      <div class="sidebar">
        <!-- Authentication Section -->
        <div class="auth-section">
          <h3 style="margin-bottom: 15px">Authentication</h3>
          <div id="auth-form" style="display: none">
            <div class="form-group">
              <label>phpBB Session ID</label>
              <input
                id="token-input"
                type="password"
                placeholder="Session ID or leave empty..."
                autocomplete="off"
              />
            </div>
            <div class="form-group" style="display: flex; gap: 10px;">
              <button id="auth-btn" style="flex: 1;" onclick="authenticate()">Login</button>
              <button id="guest-btn" style="flex: 1; background: #95a5a6;" onclick="joinAsGuest()">Guest</button>
            </div>
          </div>

          <div id="user-info" style="display: none">
            <div class="user-info">
              <div class="username" id="user-name"></div>
              <div id="user-roles"></div>
            </div>
            <div class="form-group">
              <button id="logout-btn" onclick="logout()">Logout & Refresh</button>
            </div>
          </div>
        </div>

        <!-- Rooms Section -->
        <div class="sidebar-section" id="rooms-section" style="display: none">
          <h3>Chat Rooms</h3>
          <ul class="rooms-list" id="rooms-list"></ul>

          <div id="create-room-container" style="margin-top: 15px">
            <div class="form-group">
              <label>Join/Create Room</label>
              <input
                id="new-room-input"
                type="text"
                placeholder="Room ID (e.g., general, gaming)"
                autocomplete="off"
              />
            </div>
            <div class="form-group">
              <button onclick="joinNewRoom()">Join</button>
            </div>
          </div>
        </div>

        <!-- Online Users -->
        <div class="sidebar-section" id="online-users-section" style="display: none">
          <h3>Online Users</h3>
          <ul class="online-users" id="online-users"></ul>
        </div>
      </div>

      <!-- MAIN CONTENT -->
      <div class="main-content">
        <div id="auth-placeholder" class="placeholder">
          <h3>Welcome to {{APP_NAME}}</h3>
          <p style="margin-top: 20px; color: #7f8c8d">
            � Please log in or join as a guest to continue...
          </p>
        </div>

        <div id="chat-container" style="display: none; flex: 1; display: flex; flex-direction: column; min-height: 0;">
          <div class="header">
            <h2 id="room-name">Select a room</h2>
            <div class="header-info">
              <span id="user-count">0 users</span> in room
            </div>
          </div>

          <div class="messages" id="messages"></div>

          <div id="typing-list" class="typing-indicator" style="display: none; padding: 0 20px">
          </div>

          <div class="input-area">
            <div class="input-wrapper">
              <input
                id="message-input"
                type="text"
                placeholder="Type a message..."
                autocomplete="off"
                maxlength="5000"
                onkeyup="handleMessageInput(event)"
              />
              <button id="send-btn" onclick="sendMessage()" disabled>Send</button>
            </div>
          </div>
        </div>

        <div id="status-msg" class="status" style="display: none"></div>
      </div>
    </div>

    <script>
      let serverConfig = { allowGuests: true, allowRoomCreation: true };
      
      // Fetch server config matching guests policy before connecting
      fetch('/api/config')
        .then(res => res.json())
        .then(config => {
          serverConfig = config;
          if (!serverConfig.allowGuests) {
            const guestBtn = document.getElementById('guest-btn');
            if (guestBtn) guestBtn.style.display = 'none';
          }
          if (!serverConfig.allowRoomCreation) {
            const createRoomContainer = document.getElementById('create-room-container');
            if (createRoomContainer) createRoomContainer.style.display = 'none';
          }
        })
        .catch(err => console.error('Could not load server config:', err));

      let socket = null;
      let currentUser = null;
      let currentRoom = null;
      let localRoomMessages = new Map(); // Store lists of messages per room
      let historyFetched = new Set();    // Track which rooms have fetched their backlogs
      let unreadRooms = new Set();
      const typingStates = new Map();
      let socketUsers = new Map();

      /**
       * Check if socket is ready to use
       */
      function isSocketReady() {
        return socket && socket.connected;
      }

      /**
       * Initialize Socket.io connection
       * This function waits for Socket.io to be available before creating the connection
       */
      function initializeSocket() {
        if (!window.io) {
          console.error('Socket.io library not loaded yet. Retrying...');
          setTimeout(initializeSocket, 500);
          return;
        }

        socket = io({
          reconnection: true,
          reconnectionDelay: 1000,
          reconnectionDelayMax: 5000,
          reconnectionAttempts: 5,
        });

        // ============== SOCKET EVENTS ==============

        socket.on('connect', () => {
          console.log('Connected to server');
          showStatus('Connected. Checking for session cookies...', 'success');
          // Try to auto-authenticate using background cookies first
          socket.emit('authenticate', {}, (response) => {
            if (response.success) {
              currentUser = response.user;
              updateUI();
              showStatus(`Welcome back, ${currentUser.username}!`, 'success');
              joinRoom('public', 'Public');
            } else {
              showStatus('Please login with your Session ID or join as a guest.', 'info');
              updateUI();
            }
          });
        });

        socket.on('dm-received', (data) => {
        console.log('[DM DEBUG] Received dm-received event', data);
        if (currentRoom !== data.roomId) {
          console.log('[DM DEBUG] Received DM for different room:', data.roomId);
          unreadRooms.add(data.roomId);
          
          // If the room isn't joined yet, join it silently in the background so it shows as active in our room list.
          // Instead of calling joinRoom (which changes currentRoom and UI), we emit join-room silently.
          socket.emit('join-room', { roomId: data.roomId }, (response) => {
            if (response.success) {
              loadRooms();
            }
          });
          
          loadRooms(); // Re-render to show unread indicator
        }
      });

      socket.on('rooms-updated', () => {
        if (currentUser) {
          loadRooms();
        }
      });

      socket.on('disconnect', () => {
          console.log('Disconnected from server');
          showStatus('Disconnected from server', 'error');
          currentUser = null;
          updateUI();
        });

        socket.on('error', (error) => {
          console.error('Socket error:', error);
          showStatus(error.message || 'Socket error', 'error');
        });

        socket.on('user-online', (data) => {
          console.log(`User online: ${data.username}`);
          updateOnlineUsers();
        });

        socket.on('user-offline', (data) => {
          console.log(`User offline: ${data.username}`);
          updateOnlineUsers();
        });

        socket.on('user-joined-room', (data) => {
          console.log(`User joined room: ${data.username}`);
          if (data.roomId === currentRoom) {
            addSystemMessage(`${data.username} joined the room`);
            loadRoomInfo();
          }
          updateOnlineUsers();
        });

        socket.on('user-left-room', (data) => {
          console.log(`User left room: ${data.username}`);
          if (data.roomId === currentRoom) {
            addSystemMessage(`${data.username} left the room`);
            loadRoomInfo();
          }
          updateOnlineUsers();
        });

        socket.on('message-received', (data) => {
          if (!localRoomMessages.has(data.roomId)) {
            localRoomMessages.set(data.roomId, []);
          }
          localRoomMessages.get(data.roomId).push(data.message);

          if (data.roomId === currentRoom) {
            addMessage(data.message);
          } else {
            // Unread message for a background room
            unreadRooms.add(data.roomId);
            loadRooms(); // Refresh the room list to show unread indicator
          }
        });

        socket.on('user-typing', (data) => {
          if (data.roomId === currentRoom) {
            typingStates.set(data.userId, data.username);
            updateTypingIndicator();
          }
        });

        socket.on('user-stopped-typing', (data) => {
          if (data.roomId === currentRoom) {
            typingStates.delete(data.userId);
            updateTypingIndicator();
          }
        });
      }

      // ============== UI FUNCTIONS ==============

      function updateUI() {
        try {
          if (currentUser) {
            const authForm = document.getElementById('auth-form');
            const userInfo = document.getElementById('user-info');
            const roomsSection = document.getElementById('rooms-section');
            const onlineSection = document.getElementById('online-users-section');
            const authPlaceholder = document.getElementById('auth-placeholder');
            const chatContainer = document.getElementById('chat-container');
            
            if (authForm) authForm.style.display = 'none';
            if (userInfo) userInfo.style.display = 'block';
            if (roomsSection) roomsSection.style.display = 'block';
            if (onlineSection) onlineSection.style.display = 'block';
            if (authPlaceholder) authPlaceholder.style.display = 'none';
            if (chatContainer) chatContainer.style.display = 'flex';

            const userName = document.getElementById('user-name');
            if (userName) userName.textContent = currentUser.username;
            
            const userRolesEl = document.getElementById('user-roles');
            if (userRolesEl) {
              const rolesHtml = currentUser.roles
                .map((r) => `<span class="user-role">${escapeHtml(r)}</span>`)
                .join('');
              userRolesEl.innerHTML = rolesHtml;
            }

            if (socket && socket.connected) {
              loadRooms();
              updateOnlineUsers();
            }
          } else {
            const authForm = document.getElementById('auth-form');
            const userInfo = document.getElementById('user-info');
            const roomsSection = document.getElementById('rooms-section');
            const onlineSection = document.getElementById('online-users-section');
            const chatContainer = document.getElementById('chat-container');
            const authPlaceholder = document.getElementById('auth-placeholder');
            const messages = document.getElementById('messages');
            
            if (authForm) authForm.style.display = 'block';
            if (userInfo) userInfo.style.display = 'none';
            if (roomsSection) roomsSection.style.display = 'none';
            if (onlineSection) onlineSection.style.display = 'none';
            if (chatContainer) chatContainer.style.display = 'none';
            if (authPlaceholder) authPlaceholder.style.display = 'block';
            if (messages) messages.innerHTML = '';
            currentRoom = null;
          }
        } catch (error) {
          console.error('Error updating UI:', error);
        }
      }

      function authenticate() {
        if (!isSocketReady()) {
          showStatus('Connecting to server...', 'info');
          setTimeout(authenticate, 500);
          return;
        }

        const token = document.getElementById('token-input').value.trim();
        
        socket.emit('authenticate', { token: token }, (response) => {
          if (response.success) {
            currentUser = response.user;
            document.getElementById('token-input').value = '';
            updateUI();
            showStatus(`Welcome, ${currentUser.username}!`, 'success');
            joinRoom('public', 'Public');
          } else {
            showStatus(response.error || 'Authentication failed', 'error');
          }
        });
      }

      function joinAsGuest() {
        if (!isSocketReady()) {
          showStatus('Connecting to server...', 'info');
          setTimeout(joinAsGuest, 500);
          return;
        }

        socket.emit('authenticate', { isGuest: true }, (response) => {
          if (response.success) {
            currentUser = response.user;
            document.getElementById('token-input').value = '';
            updateUI();
            showStatus(`Welcome to the chat, ${currentUser.username}!`, 'success');
            joinRoom('public', 'Public');
          } else {
            showStatus(response.error || 'Failed to join as guest', 'error');
          }
        });
      }

      function logout() {
        currentUser = null;
        currentRoom = null;
        updateUI();
        showStatus('Logged out - Refreshing...', 'info');
        setTimeout(() => window.location.reload(), 1000);
      }

      function loadRooms() {
        socket.emit('get-rooms', {}, (response) => {
          if (!response.success) return;

          const roomsList = document.getElementById('rooms-list');
          roomsList.innerHTML = '';

          response.rooms.forEach((room) => {
            const li = document.createElement('li');
            li.style.display = 'flex';
            li.style.justifyContent = 'space-between';
            li.style.alignItems = 'center';
            li.className = currentRoom === room.id ? 'active' : '';
            
            const nameSpan = document.createElement('span');
            let roomLabel = `${room.name} (${room.userCount})`;
            if (unreadRooms.has(room.id)) {
              roomLabel = `🔴 ${roomLabel}`;
              nameSpan.style.fontWeight = 'bold';
            }
            nameSpan.textContent = roomLabel;
            nameSpan.style.cursor = 'pointer';
            nameSpan.style.flexGrow = '1';
            nameSpan.onclick = () => switchRoom(room.id, room.name, room.isJoined);
            li.appendChild(nameSpan);

            // Add Leave button if user is joined, otherwise it's just a viewable/joinable room
            if (room.isJoined) {
              const leaveBtn = document.createElement('span');
              leaveBtn.textContent = '×';
              leaveBtn.title = 'Leave room';
              leaveBtn.style.color = '#e74c3c';
              leaveBtn.style.cursor = 'pointer';
              leaveBtn.style.fontWeight = 'bold';
              leaveBtn.style.padding = '0 5px';
              leaveBtn.onclick = (e) => {
                e.stopPropagation(); // prevent clicking the li naturally 
                leaveRoom(room.id);
              };
              li.appendChild(leaveBtn);
            }

            roomsList.appendChild(li);
          });
        });
      }

      function leaveRoom(roomId) {
        socket.emit('leave-room', { roomId }, (response) => {
          if (response.success) {
            localRoomMessages.delete(roomId);
            historyFetched.delete(roomId);
            if (currentRoom === roomId) {
              currentRoom = null;
              document.getElementById('room-name').textContent = 'Select a room';
              clearMessages();
            }
            loadRooms();
          }
        });
      }

      function joinNewRoom() {
        const roomId = document.getElementById('new-room-input').value.trim();
        if (!roomId) {
          showStatus('Please enter a room ID', 'error');
          return;
        }

        joinRoom(roomId, roomId);
        document.getElementById('new-room-input').value = '';
      }

      function switchRoom(roomId, roomName, isJoined) {
        if (!isJoined) {
          // If the user isn't actually a member in the backend, naturally route them to joining
          joinRoom(roomId, roomName);
          return;
        }

        // The user is already joined. Focus without sending join commands to the server.
        currentRoom = roomId;
        if (unreadRooms.has(roomId)) {
          unreadRooms.delete(roomId);
        }
        
        document.getElementById('room-name').textContent = roomName;
        clearMessages();
        
        // Render messages
        if (historyFetched.has(roomId)) {
          localRoomMessages.get(roomId).forEach((msg) => addMessage(msg));
        } else {
          // Fetch history transparently if we don't have it locally (e.g. tab refresh)
          socket.emit('get-room-info', { roomId }, (response) => {
            if (response.success) {
              const existingNewMessages = localRoomMessages.get(roomId) || [];
              
              // We could merge here, but for simplicity we'll just replace with the server's truth
              // which includes the newly received messages anyway if recent.
              localRoomMessages.set(roomId, response.room.recentMessages);
              historyFetched.add(roomId);
              
              response.room.recentMessages.forEach((msg) => addMessage(msg));
              document.getElementById('user-count').textContent = response.room.users.length;
            }
          });
        }
        
        document.getElementById('message-input').focus();
        loadRooms(); // Re-render the active sidebar item
        updateOnlineUsers();
        loadRoomInfo(); // Fetch user count for the top right
      }

      function joinRoom(roomId, roomName, dmWith = null) {
        const request = dmWith !== null ? { dmWith } : { roomId };
        socket.emit('join-room', request, (response) => {
          if (response.success) {
            // For DMs the server decides the room ID
            roomId = response.room.id;
            currentRoom = roomId;
            if (unreadRooms.has(roomId)) {
              unreadRooms.delete(roomId);
            }
            
            document.getElementById('room-name').textContent = roomName;
            clearMessages();
            localRoomMessages.set(roomId, response.room.recentMessages);
            historyFetched.add(roomId);
            response.room.recentMessages.forEach((msg) => addMessage(msg));
            
            // We already get the users natively when joining
            document.getElementById('user-count').textContent = response.room.users.length;
            
            showStatus(`Joined ${roomName}`, 'success');
            document.getElementById('message-input').focus();
            loadRooms();
            updateOnlineUsers();
          } else {
            showStatus(response.error, 'error');
          }
        });
      }

      function loadRoomInfo() {
        if (!currentRoom) return;

        // Used when another user dynamically joins/leaves to refresh the top counter
        socket.emit('get-online-users', { roomId: currentRoom }, (response) => {
          if (response.success) {
            document.getElementById('user-count').textContent = response.users.length;
          }
        });
      }

      function sendMessage() {
        const text = document.getElementById('message-input').value.trim();
        if (!text || !currentRoom) return;

        socket.emit('send-message', { roomId: currentRoom, text }, (response) => {
          if (response.success) {
            document.getElementById('message-input').value = '';
            document.getElementById('send-btn').disabled = true;
            socket.emit('typing-stop', { roomId: currentRoom });
          } else {
            showStatus(response.error, 'error');
          }
        });
      }

      function handleMessageInput(event) {
        const input = event.target;
        const hasText = input.value.trim().length > 0;

        document.getElementById('send-btn').disabled = !hasText;

        if (hasText && event.key !== 'Enter') {
          socket.emit('typing-indicator', { roomId: currentRoom });
        } else if (event.key === 'Enter') {
          sendMessage();
        }
      }

      function clearMessages() {
        document.getElementById('messages').innerHTML = '';
        typingStates.clear();
      }

      function addMessage(msg) {
        const messagesDiv = document.getElementById('messages');
        const msgEl = document.createElement('div');
        msgEl.className = 'message';

        const time = new Date(msg.timestamp).toLocaleTimeString([], {
          hour: '2-digit',
          minute: '2-digit',
        });

        msgEl.innerHTML = `
          <div class="message-header">
            ${escapeHtml(msg.username)}
            <span class="message-meta">${time}</span>
          </div>
          <div class="message-text">${escapeHtml(msg.text)}</div>
        `;

        messagesDiv.appendChild(msgEl);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
      }

      function addSystemMessage(text) {
        const messagesDiv = document.getElementById('messages');
        const msgEl = document.createElement('div');
        msgEl.className = 'message';
        msgEl.innerHTML = `<div style="color: #95a5a6; font-style: italic; text-align: center">${escapeHtml(text)}</div>`;
        messagesDiv.appendChild(msgEl);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
      }

      function updateOnlineUsers() {
        socket.emit('get-online-users', { roomId: currentRoom }, (response) => {
          if (!response.success) return;

          const usersList = document.getElementById('online-users');
          usersList.innerHTML = '';

          response.users.forEach((user) => {
            const li = document.createElement('li');
            li.textContent = user.username;
            
            // Allow clicking on other users to start a direct message
            if (currentUser && String(user.userId) !== String(currentUser.id)) {
              li.style.cursor = 'pointer';
              li.style.textDecoration = 'underline';
              li.title = `Click to private message ${user.username}`;
              li.onclick = () => startDirectMessage(user.userId, user.username);
            }

            usersList.appendChild(li);
          });
        });
      }

      function startDirectMessage(targetId, targetUsername) {
        if (!currentUser) return;
        // The server derives the DM room ID and creates the room if needed.
        // Joining an already-joined room is a no-op on the server side.
        joinRoom(null, `DM: ${targetUsername}`, targetId);
      }

      function updateTypingIndicator() {
        const typingList = document.getElementById('typing-list');
        if (typingStates.size === 0) {
          typingList.style.display = 'none';
        } else {
          const names = Array.from(typingStates.values()).join(', ');
          typingList.textContent = `${names} ${typingStates.size === 1 ? 'is' : 'are'} typing...`;
          typingList.style.display = 'block';
        }
      }

      function showStatus(message, type = 'info') {
        const statusEl = document.getElementById('status-msg');
        statusEl.textContent = message;
        statusEl.className = `status ${type}`;
        statusEl.style.display = 'block';

        setTimeout(() => {
          statusEl.style.display = 'none';
        }, 4000);
      }

      function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
      }

      // Initialize
      if (document.readyState === 'loading') {
        // DOM is still loading - wait for DOMContentLoaded
        document.addEventListener('DOMContentLoaded', () => {
          try {
            updateUI();
            setTimeout(initializeSocket, 100);
          } catch (error) {
            console.error('Initialization error:', error);
          }
        });
      } else {
        // DOM is already loaded (page was cached or script loaded late)
        try {
          updateUI();
          setTimeout(initializeSocket, 100);
        } catch (error) {
          console.error('Initialization error:', error);
        }
      }
    </script>
  </body>
</html>
