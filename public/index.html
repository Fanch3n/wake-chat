<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>{{APP_NAME}}</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash of the wrong theme
      try {
        const savedTheme = localStorage.getItem('wake-theme');
        if (savedTheme === 'light' || savedTheme === 'dark') {
          document.documentElement.dataset.theme = savedTheme;
        }
      } catch (e) {}
    </script>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%232f64d6' d='M6 4h20a4 4 0 0 1 4 4v12a4 4 0 0 1-4 4H13l-7 6v-6a4 4 0 0 1-4-4V8a4 4 0 0 1 4-4z'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/css/app.css" />
    <!-- Served by the chat server itself, so it always matches the server's Socket.IO version.
         Deferred scripts and modules run in order after parsing, so io() exists when app.js runs. -->
    <script defer src="/socket.io/socket.io.min.js"></script>
    <script type="module" src="/js/app.js"></script>
  </head>
  <body class="{{BODY_CLASS}}">
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <symbol id="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="12" cy="12" r="4" />
        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
      </symbol>
      <symbol id="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
      </symbol>
      <symbol id="i-menu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M4 6h16M4 12h16M4 18h16" />
      </symbol>
      <symbol id="i-send" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 2 11 13M22 2l-7 20-4-9-9-4z" />
      </symbol>
      <symbol id="i-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <path d="M6 6l12 12M18 6 6 18" />
      </symbol>
      <symbol id="i-logout" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9" />
      </symbol>
    </svg>

    <div class="app">
      <!-- SIDEBAR -->
      <aside class="sidebar signed-in-only" id="sidebar" aria-label="Rooms and users">
        <div class="sidebar-header">
          <div class="brand">{{APP_NAME}}</div>
        </div>

        <div class="sidebar-scroll">
          <div class="section-title">Rooms</div>
          <ul class="nav-list" id="rooms-list"></ul>

          <form class="join-form" id="create-room-container" autocomplete="off">
            <input
              id="new-room-input"
              class="input input-sm"
              type="text"
              placeholder="Join or create a room"
              aria-label="Room name to join or create"
            />
            <button class="btn btn-secondary btn-sm" type="submit">Join</button>
          </form>

          <div id="dm-section" hidden>
            <div class="section-title">Direct messages</div>
            <ul class="nav-list" id="dm-list"></ul>
          </div>

          <div class="section-title">
            <span id="online-title">Online</span>
            <span id="online-count"></span>
          </div>
          <ul class="nav-list" id="online-users"></ul>
        </div>

        <div class="user-card">
          <div class="avatar" id="user-avatar" aria-hidden="true"></div>
          <div class="user-card-info">
            <div class="user-card-name" id="user-name"></div>
            <div class="user-card-roles" id="user-roles"></div>
          </div>
          <button class="icon-btn" id="logout-btn" type="button" title="Sign out" aria-label="Sign out">
            <svg class="icon"><use href="#i-logout" /></svg>
          </button>
        </div>
      </aside>
      <div class="backdrop" id="backdrop"></div>

      <!-- MAIN CONTENT -->
      <main class="main">
        <header class="topbar">
          <button class="icon-btn menu-btn" id="menu-btn" type="button" aria-label="Open rooms" aria-controls="sidebar">
            <svg class="icon"><use href="#i-menu" /></svg>
          </button>
          <div class="topbar-title">
            <h1 id="room-name">{{APP_NAME}}</h1>
            <div class="topbar-meta" id="room-meta"></div>
          </div>
          <button class="icon-btn" id="theme-btn" type="button">
            <svg class="icon"><use id="theme-icon" href="#i-moon" /></svg>
          </button>
        </header>

        <section class="welcome signed-out-only" id="auth-placeholder">
          <form class="welcome-card" id="auth-form" autocomplete="off">
            <h2>Welcome to {{APP_NAME}}</h2>
            <p>If you're logged in to the forum, you'll be signed in automatically.</p>

            <div class="field">
              <label for="token-input">phpBB session ID</label>
              <input id="token-input" class="input" type="password" placeholder="Paste your session ID" />
              <div class="field-hint">Only needed if automatic sign-in doesn't work.</div>
            </div>

            <div class="welcome-actions">
              <button class="btn btn-primary" id="auth-btn" type="submit">Sign in</button>
              <button class="btn btn-secondary" id="guest-btn" type="button">Continue as guest</button>
            </div>

            <div class="connection-state" id="connection-state" role="status">Connecting…</div>
          </form>
        </section>

        <section class="chat signed-in-only" id="chat-container">
          <div class="messages" id="messages" role="log"></div>
          <div class="typing" id="typing-list"></div>
          <form class="composer" id="composer">
            <div class="composer-box">
              <textarea
                id="message-input"
                rows="1"
                placeholder="Type a message…"
                maxlength="5000"
                aria-label="Message"
              ></textarea>
              <button class="btn btn-primary send-btn" id="send-btn" type="submit" aria-label="Send" disabled>
                <svg class="icon"><use href="#i-send" /></svg>
              </button>
            </div>
          </form>
        </section>

        <div class="toast" id="status-msg" role="status" hidden></div>
      </main>
    </div>
  </body>
</html>
